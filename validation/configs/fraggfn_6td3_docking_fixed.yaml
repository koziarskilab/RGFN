# FragGFN FIXED-REWARD baseline on the 6TD3 two-tier docking DIFFERENTIAL.
#
# Per-step docking-in-the-loop for the non-synthesizable foil: each training step shells to
# `conda run -n rgfn scripts/score_batch.py --oracle docking_6td3_gpu` (QV2-GPU pose-gen +
# gnina CNN pose-select + two-tier Vina) via DockingBridgeReward, training FragGFN on
# clip(-dvina). No AL loop, no oracle. FragGFN uses its OWN fragment library. Matches RGFN's
# configs/glue/fixed_reward_6td3.gin (beta=4, 400 iters). See Logs/021.
#
# Run (repo root, fraggfn env; docking libs exported for the rgfn subprocess):
#   conda run -n fraggfn python validation/generators/fraggfn/run_fraggfn_fixed.py \
#       --cfg validation/configs/fraggfn_6td3_docking_fixed.yaml --root-dir $SCRATCH/rgfn_runs/experiments

run:
  name: fixed_reward/fraggfn_6td3
  root_dir: experiments
  seed: 42

fixed_reward:
  n_train_steps: 400
  n_samples: 200
  sample_oversample: 6.0
  top_k: 100
  beta: 4
  system: 6td3
  reward_name: 6td3_diff
  score_units: "clip(-dvina) reward (higher is better; raw dvina in raw_score column)"

reward:
  type: docking
  oracle: docking_6td3_gpu
  norm: 1.0
  clip: 10.0

gflownet:
  max_nodes: 9
  num_emb: 128
  num_layers: 4
  sampling_tau: 0.9
  learning_rate: 1.0e-4
  print_every: 10

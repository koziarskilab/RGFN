# RxnFlow FIXED-REWARD baseline on the DRD2 surrogate reward generator (RGFN paper's 3rd
# proxy). Same as rxnflow_seh_fixed.yaml but the reward is the DRD2 activity oracle: trains
# RxnFlow's synthesis GFN ONCE against the frozen DRD2 model (the SAME reward RGFN's
# fixed_reward_drd2.gin uses — TDC sklearn+FCFP, reproduced from the cached pickle).
# Synthesizable -> has_route=1 + routes.jsonl.
#
# Run (repo root, rxnflow env; candidate emission shells to the rgfn env):
#   conda run -n rxnflow python validation/generators/rxnflow/run_rxnflow_fixed.py \
#       --cfg validation/configs/rxnflow_drd2_fixed.yaml --root-dir $SCRATCH/rgfn_runs/experiments

run:
  name: fixed_reward/rxnflow_drd2
  root_dir: experiments
  seed: 42

fixed_reward:
  n_train_steps: 5000
  n_samples: 1000
  sample_oversample: 4.0
  top_k: 100
  beta: 48                    # == RGFN fixed_reward_drd2.gin beta
  system: drd2
  reward_name: drd2
  score_units: "drd2_tdc_activity (higher is better; 0-1)"

reward:
  type: drd2
  model_path: /home/markymoo/projects/RGFN_Fork/RGFN-Fork/oracle/drd2_current.pkl
  clip: 10.0

rxnflow:
  env_dir: data/models/rxnflow_env
  max_reactions: 4
  num_emb: 128
  num_layers: 4
  sampling_tau: 0.9
  learning_rate: 1.0e-4
  print_every: 100
  action_sampling_ratio: 0.01

# RxnFlow FIXED-REWARD baseline on ClpP GPU DOCKING (single target) — SHARED SMALL library.
#
# Per-step docking-in-the-loop for the synthesizable peer: each training step shells to
# `conda run -n rgfn scripts/score_batch.py --oracle docking_clpp` via DockingBridgeReward,
# training RxnFlow on clip(-Vina). RxnFlow builds from the shared standard set
# (data/models/rxnflow_env_stdlib = glue_standard_v1) so it matches RGFN/SCENT. Routes ->
# has_route=1. No AL loop, no oracle. Matches RGFN's fixed_reward_clpp_docking.gin (beta=4, 400).
#
# Run (repo root, rxnflow env; docking libs exported for the rgfn subprocess):
#   conda run -n rxnflow python validation/generators/rxnflow/run_rxnflow_fixed.py \
#       --cfg validation/configs/rxnflow_clpp_docking_fixed.yaml --root-dir $SCRATCH/rgfn_runs/experiments

run:
  name: fixed_reward/rxnflow_clpp
  root_dir: experiments
  seed: 42

fixed_reward:
  n_train_steps: 400
  n_samples: 200
  sample_oversample: 6.0
  top_k: 100
  beta: 4
  system: clpp
  reward_name: clpp_docking
  score_units: "clip(-vina) reward (higher is better; raw Vina kcal/mol in raw_score column)"

reward:
  type: docking
  oracle: docking_clpp
  norm: 1.0
  clip: 10.0

rxnflow:
  env_dir: data/models/rxnflow_env_stdlib  # SHARED library (glue_standard_v1 baked)
  max_reactions: 4
  num_emb: 128
  num_layers: 4
  sampling_tau: 0.9
  learning_rate: 1.0e-4
  print_every: 10
  action_sampling_ratio: 0.01

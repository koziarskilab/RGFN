# RxnFlow FIXED-REWARD baseline on DRD2 — SHARED-LIBRARY variant.
#
# Identical to validation/configs/rxnflow_drd2_fixed.yaml (train RxnFlow ONCE against the
# frozen DRD2 TDC activity oracle, beta=48, no loop / no oracle, routes -> has_route=1)
# EXCEPT the library: uses the shared standard set glue_standard_v1 baked into
# data/models/rxnflow_env_stdlib (412 blocks / 112 templates from SCENT's SMALL library)
# instead of RxnFlow's native 10k ZINCFrag blocks, so RGFN / SCENT / RxnFlow all share ONE
# library for the four-way DRD2 comparison. Mirrors rxnflow_seh_fixed_stdlib.yaml. See Logs/020.
#
# Run (repo root, rxnflow env; candidate emission shells to rgfn env):
#   conda run -n rxnflow python validation/generators/rxnflow/run_rxnflow_fixed.py \
#       --cfg validation/configs/rxnflow_drd2_fixed_stdlib.yaml --root-dir $SCRATCH/rgfn_runs/experiments

run:
  name: fixed_reward/rxnflow_drd2_stdlib
  root_dir: experiments
  seed: 42

fixed_reward:
  n_train_steps: 5000
  n_samples: 1000
  sample_oversample: 4.0
  top_k: 100
  beta: 48                    # == RGFN fixed_reward_drd2.gin beta
  system: drd2
  reward_name: drd2
  score_units: "drd2_tdc_activity (higher is better; 0-1)"

reward:
  type: drd2
  model_path: /home/markymoo/projects/RGFN_Fork/RGFN-Fork/oracle/drd2_current.pkl
  clip: 10.0

rxnflow:
  env_dir: data/models/rxnflow_env_stdlib  # SHARED library (glue_standard_v1 baked; 412 blocks / 112 templates)
  max_reactions: 4
  num_emb: 128
  num_layers: 4
  sampling_tau: 0.9
  learning_rate: 1.0e-4
  print_every: 100
  action_sampling_ratio: 0.01

# RxnFlow FIXED-REWARD baseline on sEH — the SYNTHESIZABLE peer to the RGFN fixed-reward
# entrant. Mirrors rxnflow_seh.yaml but single-shot (no active-learning loop, no oracle):
# train RxnFlow's reaction-template + building-block synthesis GFN ONCE against the FROZEN
# pretrained Bengio-2021 sEH proxy (the SAME reward generator RGFN's
# fixed_reward_seh_proxy.gin uses), then sample + emit candidates WITH synthesis routes
# (has_route=1). Only the GENERATOR differs from RGFN (RxnFlow's action space).
#
# Run (from repo root, rxnflow env; candidate emission shells to the rgfn env):
#   conda run -n rxnflow python validation/generators/rxnflow/run_rxnflow_fixed.py \
#       --cfg validation/configs/rxnflow_seh_fixed.yaml \
#       --root-dir $SCRATCH/rgfn_runs/experiments

run:
  name: fixed_reward/rxnflow_seh       # run dir: <root>/fixed_reward/rxnflow_seh/<timestamp>
  root_dir: experiments               # overridden by --root-dir on Balam ($SCRATCH)
  seed: 42

fixed_reward:
  n_train_steps: 5000        # ~matched to RGFN's Trainer.n_iterations=5002 (single-shot)
  n_samples: 1000            # unique valid molecules to emit as candidates
  sample_oversample: 4.0
  top_k: 100
  beta: 8                    # == RGFN fixed_reward_seh_proxy.gin beta (fixed inverse temperature)

# Frozen sEH reward generator (pretrained Bengio-2021 MPNN via gflownet.models.bengio2021flow).
reward:
  clip: 10.0
  batch_size: 128

# RxnFlow synthesis-GFlowNet generator hyperparams (mirror rxnflow_seh.yaml).
rxnflow:
  env_dir: data/models/rxnflow_env   # prepared blocks + 71 templates (setup_rxnflow.sh)
  max_reactions: 4                   # synthesis depth (trajectory length)
  num_emb: 128
  num_layers: 4
  sampling_tau: 0.9
  learning_rate: 1.0e-4
  print_every: 100
  action_sampling_ratio: 0.01        # action-space subsampling (RxnFlow's key trick)
  # device: auto (cuda if available)
